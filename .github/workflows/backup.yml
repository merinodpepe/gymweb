name: Monthly database backup

# Dumps the Neon database once a month, encrypts it (the repo is public, so
# artifacts must never be readable without the passphrase) and keeps it 90 days.
on:
  schedule:
    - cron: "0 4 1 * *" # 04:00 UTC on the 1st of every month
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Set BACKUP_DATABASE_URL and BACKUP_PASSPHRASE in Settings → Secrets → Actions (see SETUP.md)."
            exit 1
          fi
      - name: pg_dump (Postgres 17 client)
        run: |
          docker run --rm -e DATABASE_URL postgres:17 \
            sh -c 'pg_dump --no-owner --no-privileges "$DATABASE_URL"' > gymweb.sql
          test -s gymweb.sql
          gzip gymweb.sql
      - name: Encrypt
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o "gymweb-$(date +%F).sql.gz.gpg" gymweb.sql.gz
          rm gymweb.sql.gz
      - uses: actions/upload-artifact@v4
        with:
          name: gymweb-backup-${{ github.run_id }}
          path: gymweb-*.sql.gz.gpg
          retention-days: 90
