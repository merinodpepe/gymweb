name: Lyfta sync

# Lyfta has no webhooks, so poll every 15 minutes. Needs repo secrets:
#   APP_URL      e.g. https://gymweb-xxxx.vercel.app (no trailing slash)
#   CRON_SECRET  same value as the CRON_SECRET env var in Vercel
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::APP_URL / CRON_SECRET not set; skipping Lyfta sync."
            exit 0
          fi
      - name: Call sync endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          [ -z "$APP_URL" ] && exit 0
          curl --fail-with-body -sS -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/sync-lyfta/cron"
