# Local development database that speaks Neon's HTTP protocol.
# Usage: docker compose up -d, then use the .env.example local values.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gymweb
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gymweb"]
      interval: 2s
      retries: 20
  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    environment:
      PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/gymweb
    ports: ["4444:4444"]
    depends_on:
      postgres:
        condition: service_healthy
